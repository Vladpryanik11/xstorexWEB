name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels a running pull request check; a running check on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No workflow-wide DATABASE_URL: prisma generate does not connect (prisma.config.ts falls back to a
# placeholder URL), and the integration job sets the *_TEST URLs that its tests use.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xstore
          POSTGRES_PASSWORD: xstore
          POSTGRES_DB: xstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstore -d xstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://xstore:xstore@localhost:5432/xstore_test
      REDIS_URL_TEST: redis://localhost:6379/1
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: xstore
      S3_SECRET_KEY: xstore-dev-secret
      S3_BUCKET_PREFIX_TEST: xstore-test-
      SMTP_URL: smtp://localhost:1025
      MAILPIT_API: http://localhost:8025
    steps:
      - uses: actions/checkout@v5
      # Service containers cannot pass MinIO its `server /data` command, so the dev compose starts it.
      - run: docker compose -f infra/docker-compose.dev.yml up -d --wait minio mailpit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    runs-on: ubuntu-latest
    # Same infra as `integration`: the e2e API (port 3101) runs on the *_TEST database, Redis db 1
    # and the test buckets; the Playwright global setup migrates, wipes and seeds them (seed:e2e).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xstore
          POSTGRES_PASSWORD: xstore
          POSTGRES_DB: xstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xstore -d xstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://xstore:xstore@localhost:5432/xstore_test
      REDIS_URL_TEST: redis://localhost:6379/1
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: xstore
      S3_SECRET_KEY: xstore-dev-secret
      S3_BUCKET_PREFIX_TEST: xstore-test-
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f infra/docker-compose.dev.yml up -d --wait minio mailpit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xstore/web exec playwright install --with-deps webkit chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/worker/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
