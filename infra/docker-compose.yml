# Production stack. From the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build --wait
# Only Caddy publishes host ports. In-container URLs use service names and override the
# host-side localhost values that api and worker read from ../.env.
# POSTGRES_PASSWORD and MINIO_ROOT_PASSWORD have no fallback: an empty one stops
# postgres/minio from starting instead of running with a weak default.
name: xstore

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      DL_DOMAIN: ${DL_DOMAIN:-dl.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Fixed: .env holds the dev value (http://localhost:3001).
        API_INTERNAL_URL: http://api:3001
        NEXT_PUBLIC_TELEGRAM_URL: ${NEXT_PUBLIC_TELEGRAM_URL:-}
    image: xstore-web
    restart: unless-stopped
    environment:
      # Server-side rendering reads it at run time.
      API_INTERNAL_URL: http://api:3001
    depends_on:
      # Every catalog page (and the healthcheck on /) renders from the API.
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: *api-build
    image: xstore-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://xstore:${POSTGRES_PASSWORD}@postgres:5432/xstore
      REDIS_URL: redis://redis:6379/0
      SITE_URL: https://${SITE_DOMAIN:-localhost}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: https://${DL_DOMAIN:-dl.localhost}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-xstore}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Production always pays through Platega; the fake provider refuses NODE_ENV=production.
      PAYMENT_PROVIDER: platega
      XSTORE_DEV_PAGES: '0'
      # Letters; SMTP_URL may hold a password and stays in .env.
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Master key for supplier certificates; MASTER_KEY_V<n> comes from .env (env_file).
      MASTER_KEY_CURRENT: ${MASTER_KEY_CURRENT:?set MASTER_KEY_CURRENT and MASTER_KEY_V1 in .env}
      # The iPhone connection file is signed with Caddy's certificate for SITE_DOMAIN, copied by
      # `enroll-cert`. Fixed here: the development paths in .env do not exist in the container.
      ENROLL_CERT_PATH: /run/enroll/cert.pem
      ENROLL_KEY_PATH: /run/enroll/key.pem
    volumes:
      - enrollcert:/run/enroll:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # Buckets are ensured on boot.
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: xstore-worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://xstore:${POSTGRES_PASSWORD}@postgres:5432/xstore
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: https://${DL_DOMAIN:-dl.localhost}
      SITE_URL: https://${SITE_DOMAIN:-localhost}
      # Same provider as the API; billing jobs do nothing until the Platega adapter lands.
      PAYMENT_PROVIDER: platega
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      # Master key for supplier certificates; MASTER_KEY_V<n> comes from .env (env_file).
      MASTER_KEY_CURRENT: ${MASTER_KEY_CURRENT:?set MASTER_KEY_CURRENT and MASTER_KEY_V1 in .env}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-xstore}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Copies Caddy's certificate and key for SITE_DOMAIN from caddydata (read-only) for the api user;
  # see enroll-cert-sync.sh. CADDY_CERT_ISSUER is the folder Caddy keeps the certificate in:
  # Let's Encrypt by default, `local` for localhost, `acme.zerossl.com-v2-dv90` for ZeroSSL.
  enroll-cert:
    # Pinned by digest: this container reads all of caddydata (ACME account and local CA keys too).
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    restart: unless-stopped
    command: ['sh', '/enroll-cert-sync.sh']
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      CADDY_CERT_ISSUER: ${CADDY_CERT_ISSUER:-acme-v02.api.letsencrypt.org-directory}
    volumes:
      - ./enroll-cert-sync.sh:/enroll-cert-sync.sh:ro
      - caddydata:/caddy-data:ro
      - enrollcert:/enroll

  migrate:
    build: *api-build
    image: xstore-api
    restart: 'no'
    command: ['pnpm', '--filter', '@xstore/db', 'migrate:deploy']
    environment:
      DATABASE_URL: postgresql://xstore:${POSTGRES_PASSWORD}@postgres:5432/xstore
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xstore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xstore -d xstore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Chainguard build of MinIO (minio/minio is gone from Docker Hub), pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xstore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Browsers PUT upload parts straight to MinIO from the site origin.
      MINIO_API_CORS_ALLOW_ORIGIN: https://${SITE_DOMAIN:-localhost}
    volumes:
      - miniodata:/data
    healthcheck:
      # The image has no wget/curl; `mc ready` polls /minio/health/cluster until it is up.
      test: ['CMD-SHELL', 'MC_HOST_local=http://localhost:9000 timeout 4 mc ready local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  enrollcert:
