name: xstore-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xstore
      POSTGRES_PASSWORD: xstore
      POSTGRES_DB: xstore
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xstore -d xstore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard builds MinIO.
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xstore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xstore-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
