name: xstore-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xstore
      POSTGRES_PASSWORD: xstore
      POSTGRES_DB: xstore
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xstore -d xstore']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard builds MinIO. Pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xstore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xstore-dev-secret}
      # Browsers PUT upload parts straight to MinIO from the site origin.
      # The real browser upload E2E server has its own origin on 3100.
      MINIO_API_CORS_ALLOW_ORIGIN: ${SITE_URL:-http://localhost:3000},http://localhost:3100
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # The image has no wget/curl; `mc ready` polls /minio/health/cluster until it is up.
      test: ['CMD-SHELL', 'MC_HOST_local=http://localhost:9000 timeout 4 mc ready local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
